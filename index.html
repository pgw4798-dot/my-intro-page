<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정통 명리학 운명 분석관</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #1a202c 100%);
            color: #e2e8f0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: rgba(30, 36, 51, 0.85);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(246, 173, 85, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background-color: rgba(246, 173, 85, 0.15);
            color: #f6ad55;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
            border: 1px solid rgba(246, 173, 85, 0.3);
        }
        h1 {
            color: #f7fafc;
            margin: 0 0 8px 0;
            font-size: 28px;
        }
        .subtitle {
            color: #a0aec0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #cbd5e0;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #4a5568;
            background-color: rgba(45, 55, 72, 0.7);
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f6ad55;
            box-shadow: 0 0 0 3px rgba(246, 173, 85, 0.2);
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #f6ad55 0%, #dd6b20 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(221, 107, 32, 0.4);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
        #result-section {
            display: none;
            margin-top: 35px;
            border-top: 1px solid rgba(74, 85, 104, 0.6);
            padding-top: 30px;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            color: #f6ad55;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .result-card {
            background-color: rgba(22, 27, 38, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border-left: 4px solid #f6ad55;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .result-card h4 {
            color: #fbd38d;
            margin: 0 0 8px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-card p {
            color: #cbd5e0;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge">KOREAN TRADITIONAL SAJU</div>
            <h1>운명 분석관</h1>
            <div class="subtitle">정통 명리학의 기운을 담아 깊이 있는 사주를 풀어드립니다</div>
        </div>
        
        <div class="form-group">
            <label for="name">성함</label>
            <input type="text" id="name" placeholder="이름을 입력하세요">
        </div>

        <div class="form-group">
            <label for="birth">생년월일 (양력/음력)</label>
            <input type="date" id="birth">
        </div>

        <div class="form-group">
            <label for="time">태어난 시간</label>
            <select id="time">
                <option value="0">모름 / 기억 안 남</option>
                <option value="1">자시/축시 (23:00 ~ 02:59)</option>
                <option value="2">인시/묘시 (03:00 ~ 08:59)</option>
                <option value="3">진시/사시/오시/미시 (09:00 ~ 16:59)</option>
                <option value="4">신시/유시/술시/해시 (17:00 ~ 22:59)</option>
            </select>
        </div>

        <button class="btn" onclick="showSajuResult()">운명의 문 열기</button>

        <div id="result-section">
            <div class="result-title" id="main-title">✨ 운명 분석 결과</div>
            
            <div class="result-card">
                <h4>📜 총운 및 흐름</h4>
                <p id="desc-general"></p>
            </div>

            <div class="result-card">
                <h4>💰 금전 및 커리어운</h4>
                <p id="desc-wealth"></p>
            </div>

            <div class="result-card">
                <h4>💡 이번 시기 조언</h4>
                <p id="desc-advice"></p>
            </div>
        </div>
    </div>

    <script>
        function showSajuResult() {
            const name = document.getElementById('name').value;
            const birth = document.getElementById('birth').value;
            const timeSelect = document.getElementById('time').value;

            if (!name) {
                alert('성함을 입력해주세요!');
                return;
            }
            if (!birth) {
                alert('생년월일을 선택해주세요!');
                return;
            }

            // 글자수와 생년월일, 시간을 조합하여 유니크하면서도 풍성한 결과 조합 생성
            const birthNum = birth.replaceAll('-', '');
            const seed = (name.length * 7) + parseInt(birthNum.slice(-2)) + parseInt(timeSelect);

            const generals = [
                "올해는 내면에 숨겨졌던 거대한 잠재력이 수면 위로 떠오르는 대운의 흐름입니다. 오랫동안 준비해 온 일에서 가시적인 성과가 나타나며 주변의 찬사를 받게 됩니다.",
                "변화와 혁신이 찾아오는 시기입니다. 기존의 틀에 얽매이지 않고 새로운 시도를 할 때 비로소 운의 문이 크게 열리며, 뜻밖의 장소에서 귀인을 만나게 됩니다.",
                "마음의 안정과 지혜가 깊어지는 해입니다. 조급하게 앞서나가기보다는 내실을 단단히 다지는 과정 속에서 장기적인 성공의 발판을 완벽하게 다지게 됩니다.",
                "주위의 흐름이 나를 중심으로 움직이는 형국입니다. 리더십을 발휘할 기회가 찾아오며, 결단력 있게 밀고 나간다면 큰 성취감과 명예를 동시에 거머쥘 수 있습니다."
            ];

            const wealths = [
                "재물운에 있어 안정과 성장이 동시에 찾아옵니다. 계획적인 자산 관리가 빛을 발하며, 특히 직장이나 커리어 분야에서 가치 있는 성과를 인정받아 보상으로 이어집니다.",
                "뜻밖의 투자나 새로운 프로젝트 제안이 들어올 수 있는 시기입니다. 순간의 직감보다는 철저한 데이터와 분석을 바탕으로 움직일 때 큰 재물의 형국을 이룹니다.",
                "전문성을 높이는 데 투입한 시간과 노력이 배 이상의 경제적 가치로 돌아옵니다. 본업 외에 새로운 부가가치를 창출할 수 있는 기회 문이 열립니다."
            ];

            const advices = [
                "“돌다리도 두드려보고 건너라”는 속담을 기억하세요. 빠른 속도보다는 방향성의 정확함이 중요하며, 주변 동료나 소중한 인연들의 조언을 경청하면 만사형통합니다.",
                "자신을 믿고 과감하게 도전하되, 체력과 일상의 밸런스를 잃지 않도록 주의하세요. 작은 여유를 가질 때 오히려 더 큰 통찰력과 아이디어가 떠오릅니다.",
                "지나친 완벽주의는 잠시려두고, 일단 시작하고 수정해 나가는 유연함을 가져보세요. 당신의 유연한 대처 능력이 위기를 기회로 바꾸는 열쇠가 됩니다."
            ];

            // 데이터 풀에서 조합 선택
            const gIdx = seed % generals.length;
            const wIdx = (seed * 3) % wealths.length;
            const aIdx = (seed * 7) % advices.length;

            document.getElementById('main-title').innerText = `✨ ${name}님의 운명 분석 결과`;
            document.getElementById('desc-general').innerText = generals[gIdx];
            document.getElementById('desc-wealth').innerText = wealths[wIdx];
            document.getElementById('desc-advice').innerText = advices[aIdx];
            
            document.getElementById('result-section').style.display = 'block';
            
            // 결과가 나오면 부드럽게 스크롤 이동
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
