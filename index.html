<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 페이지</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h1 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666666;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .info-section {
            text-align: left;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
            margin-top: 20px;
        }
        .info-item {
            margin-bottom: 12px;
            font-size: 14px;
            color: #444444;
        }
        .info-item span {
            font-weight: bold;
            color: #222222;
            display: inline-block;
            width: 80px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>안녕하세요! 👋</h1>
        <div class="subtitle">IT Product Manager</div>
        
        <div class="info-section">
            <div class="info-item"><span>소속</span> 토스(Viva Republica)</div>
            <div class="info-item"><span>직무</span> Product Operations / PM</div>
            <div class="info-item"><span>관심사</span> 데이터 분석, 서비스 기획</div>
        </div>
    </div>

</body>
</html>
